<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loïc Pilette</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: #58a6ff;
      text-decoration: none;
      border: 1px solid #30363d;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .links a:hover {
      background: #161b22;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Loïc Pilette</h1>
    <p class="subtitle">Étudiant en mathématiques — UMons</p>
    <div class="links">
      <a href="https://github.com/LoicPil">GitHub</a>
      <a href="https://www.linkedin.com/in/lo%C3%AFc-pilette-81625a2b7">LinkedIn</a>
      <a href="mailto:ton.email@example.com">Contact</a>
    </div>
    <footer>Site en construction 🚧</footer>
  </div>
</body>
</html>
